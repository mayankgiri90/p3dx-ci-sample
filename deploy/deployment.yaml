# Kubernetes manifest for the sample; CI scans it (Dockerfile / IaC stage). Applied once by hand
# (kubectl apply -f deploy/deployment.yaml); after that the Jenkinsfile Deploy stage updates the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p3dx-ci-sample
  namespace: p3dx-ci-sample
  labels:
    app: p3dx-ci-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p3dx-ci-sample
  template:
    metadata:
      labels:
        app: p3dx-ci-sample
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/mayankgiri90/p3dx-ci-sample:0.0.0-de6eca1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
